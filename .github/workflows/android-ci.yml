name: Android CI (APK)

on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Сборка debug и release APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Лог сборки (при ошибке)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: warn

      - name: Лог ошибок в репозиторий (нужен для отладки)
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -c 400000 build.log > ci-logs/build.log || true
          grep -aE "error:|error;|\.java:[0-9]+" build.log | sort -u | head -400 > ci-logs/errors.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-logs
          git commit -m "CI: лог неудачной сборки [skip ci]" || echo "нечего коммитить"
          git pull --rebase --autostash || true
          git push || echo "push лога не удался"

      - name: Итог
        run: |
          ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/release/ || true

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Публикация APK в Releases
        if: github.ref == 'refs/heads/arena/1ba67f4e-namaz'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="build-${{ github.run_number }}"
          printf '%s\n' \
            "Автоматическая сборка из ветки ${{ github.ref_name }} (коммит ${GITHUB_SHA:0:7})." \
            "" \
            "Для установки скачайте app-release.apk — он подписан постоянным ключом и ставится поверх следующих версий." \
            "app-debug.apk — отладочная версия с отдельным идентификатором (tm.akyda.namaz.debug)." \
            "" \
            "Приложение работает полностью офлайн и не запрашивает ни одного разрешения." > notes.txt
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            --title "Akyda we Namaz — сборка ${{ github.run_number }}" \
            --notes-file notes.txt \
            --target "${{ github.sha }}" || echo "релиз уже существует или не создан"
