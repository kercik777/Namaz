name: Сборка приложения

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Собрать APK (debug)
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Проверить релизную сборку
        if: success()
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee -a build.log
        continue-on-error: true

      - name: Выложить APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: akyda-we-namaz-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Выложить лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Записать лог в репозиторий при ошибке
        if: failure()
        run: |
          tail -c 200000 build.log > build-log.txt || true
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git add -f build-log.txt
          git commit -m "лог неудачной сборки [skip ci]" || true
          git push || true
