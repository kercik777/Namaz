name: OCR книг (сканы -> текст)

# Запускается вручную (Actions → OCR книг → Run workflow) или при изменении инструментов.
# На раннере есть интернет, поэтому мультиязычные модели PP-OCRv5
# (латиница / кириллица / арабица) скачиваются автоматически.
# Запускается только вручную: текст книг уже вычитан (tools/content/fix_text.py),
# а автоматический прогон распознавания переписал бы его заново.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько страниц обработать (0 = все, для проверки)'
        required: false
        default: '0'

permissions:
  contents: write
  actions: write

concurrency:
  group: ocr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LIMIT: ${{ github.event.inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Системные зависимости (OpenCV)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0

      - name: Python-зависимости
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pillow numpy "rapidocr>=3.4" onnxruntime rapidfuzz

      - name: Быстрая проверка моделей (4 страницы)
        run: |
          set -o pipefail
          mkdir -p work
          python tools/build_pages.py --pdf "1Namaz_compressed.pdf" --book smoke \
            --out-assets work/smoke-pages --out-work work/smoke --dpi 200 --target-w 900 \
            --first-spread 5 --last-spread 6 2>&1 | tail -3
          python tools/ocr/recognize.py --work work/smoke --pages work/smoke --book smoke \
            --out work/smoke.json --workers 1 2>&1 | tee smoke.log
          python - <<'PYEOF'
          import json
          d = json.load(open("work/smoke.json", encoding="utf-8"))
          for p in d["pages"][:2]:
              print("---", p["name"], "арабица:", p["arabic_frac"], "кириллица:", p["cyrillic_frac"])
              for b in p["blocks"][:6]:
                  print("   ", b["type"], "|", b["text"][:110])
          PYEOF

      - name: Лог проверки моделей в репозиторий
        if: always()
        run: |
          mkdir -p ci-logs
          tail -c 100000 smoke.log > ci-logs/smoke.log 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-logs
          git commit -m "CI: проверка моделей OCR [skip ci]" || echo "нет изменений"
          git pull --rebase --autostash || true
          git push || echo "push не удался"

      - name: Нарезка сканов (страницы из разворотов)
        run: |
          mkdir -p work
          python tools/build_pages.py --pdf "1Namaz_compressed.pdf" --book b1 \
            --out-assets work/pages/b1 --out-work work/b1 --dpi 300 --target-w 1400 2>&1 | tail -5
          python tools/build_pages.py --pdf "2Namaz 2_compressed.pdf" --book b2 \
            --out-assets work/pages/b2 --out-work work/b2 --dpi 300 --target-w 1400 2>&1 | tail -5

      - name: Распознавание текста
        run: |
          set -o pipefail
          python tools/ocr/recognize.py --work work/b1 --pages work/b1 --book b1 \
            --out content/ocr/b1.json --workers 2 --limit "$LIMIT" 2>&1 | tee ocr-b1.log
          python tools/ocr/recognize.py --work work/b2 --pages work/b2 --book b2 \
            --out content/ocr/b2.json --workers 2 --limit "$LIMIT" 2>&1 | tee ocr-b2.log

      - name: Сборка книг для приложения
        run: |
          python tools/content/build_book.py --work work/b1 --pages work/pages/b1 \
            --ocr content/ocr/b1.json --assets app/src/main/assets --book b1 --correct --limit "$LIMIT"
          python tools/content/build_book.py --work work/b2 --pages work/pages/b2 \
            --ocr content/ocr/b2.json --assets app/src/main/assets --book b2 --correct --limit "$LIMIT"

      - name: Чистка текста и расстановка иллюстраций
        run: |
          python tools/content/mark_junk.py
          python tools/content/add_ills.py
          python tools/content/add_figs.py
          python tools/content/merge_books.py
          python tools/content/fix_text.py --all app/src/main/assets/content
          python tools/content/make_quotes.py

      - name: Публикация результата в репозиторий
        if: env.LIMIT == '0'
        run: |
          mkdir -p ci-logs
          tail -c 200000 smoke.log > ci-logs/smoke.log || true
          tail -c 200000 ocr-b1.log > ci-logs/ocr-b1.log || true
          tail -c 200000 ocr-b2.log > ci-logs/ocr-b2.log || true
          rm -rf app/src/main/assets/pages
          du -sh app/src/main/assets/content/* 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A content/ocr app/src/main/assets ci-logs
          git commit -m "OCR: распознанный текст книг (автоматически) [skip ci]" || echo "нет изменений"
          git pull --rebase --autostash || true
          git push || echo "push не удался"

      - name: Пересобрать APK с новым содержимым
        if: env.LIMIT == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run android-ci.yml --ref "${GITHUB_REF_NAME}" || echo "не удалось запустить сборку"

      - name: Лог ошибок в репозиторий (нужен для отладки)
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -c 200000 smoke.log > ci-logs/smoke.log || true
          tail -c 200000 ocr-b1.log > ci-logs/ocr-b1.log || true
          tail -c 200000 ocr-b2.log > ci-logs/ocr-b2.log || true
          grep -aiE "error|traceback|exception|ОШИБКА" ci-logs/ocr-*.log 2>/dev/null | sort -u | head -100 > ci-logs/ocr-errors.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-logs
          git commit -m "CI: лог неудачного OCR [skip ci]" || echo "нечего коммитить"
          git pull --rebase --autostash || true
          git push || echo "push лога не удался"

      - name: Артефакт с результатами
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-result
          path: |
            content/ocr
            work/*/meta.json
          if-no-files-found: warn
