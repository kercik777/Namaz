name: OCR книг (распознавание текста)

# Запускается вручную (Actions → OCR книг → Run workflow) или при изменении скриптов OCR.
# В раннере есть полный доступ в интернет, поэтому модели PP-OCRv5
# (латиница / кириллица / арабица) скачиваются автоматически.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/ocr/**'
      - '.github/workflows/ocr.yml'

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Системные зависимости (OpenCV)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0

      - name: Python-зависимости
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pillow numpy "rapidocr>=3.4" onnxruntime

      - name: Распознавание
        run: python tools/ocr/run_ocr.py 2>&1 | tee ocr.log

      - name: Публикация результата
        run: |
          ls -la content/ocr || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A content/ocr
          git commit -m "OCR: результаты распознавания книг (автоматически)" || echo "нет изменений"
          git push

      - name: Лог ошибок в репозиторий (нужен для отладки)
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -c 300000 ocr.log > ci-logs/ocr.log || true
          grep -aE "Error|error|Traceback|Exception|ОШИБКА" ocr.log | sort -u | head -200 > ci-logs/ocr-errors.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-logs
          git commit -m "CI: лог неудачного OCR [skip ci]" || echo "нечего коммитить"
          git pull --rebase --autostash || true
          git push || echo "push лога не удался"

      - name: Артефакт с результатами
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-result
          path: content/ocr
          if-no-files-found: warn
